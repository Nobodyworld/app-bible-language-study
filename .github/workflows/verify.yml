name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    name: deterministic (${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic static/domain/data contracts
        run: npm run test:static

      - name: Run publication audit
        run: npm run audit

  browser:
    name: browser (20)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop browser acceptance
        shell: pwsh
        run: |
          # Temporary instrumentation adds failure details only; assertions are unchanged.
          @'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'app/scripts/strong-preview-hydration-test.mjs';
          let source = readFileSync(path, 'utf8');
          const marker = '        keyboardTooltip,';
          if (source.split(marker).length !== 2) throw new Error('Diagnostic return marker must be unique');
          source = source.replace(marker, marker + '\n        keyboardState: { active: document.activeElement === node, focusVisible: node.matches(":focus-visible"), layerVisible: Boolean(layer), text: layer?.textContent || "", expected: expectedTooltip, rect: tooltipRect ? { left: tooltipRect.left, right: tooltipRect.right, top: tooltipRect.top, bottom: tooltipRect.bottom } : null, outlineStyle: style.outlineStyle, outlineWidth: style.outlineWidth },');
          source = source.replace('or focus indication failed`', 'or focus indication failed: ${JSON.stringify(result.keyboardState)}`');
          writeFileSync(path, source);
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP 'desktop-browser-acceptance.log'
          npm run test:browser *> $log
          $result = $LASTEXITCODE
          Get-Content -LiteralPath $log -Tail 30 | ForEach-Object {
            $line = [string]$_
            if ($line.Length -gt 2400) {
              Write-Output ($line.Substring(0, 2100) + ' ... [diagnostic line truncated] ... ' + $line.Substring($line.Length - 300))
            } else {
              Write-Output $line
            }
          }
          exit $result

      - name: Run mobile browser acceptance
        run: npm run test:browser:mobile
