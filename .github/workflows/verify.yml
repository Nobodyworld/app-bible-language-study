name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    name: deterministic (${{ matrix.node-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic static/domain/data contracts
        run: npm run test:static

      - name: Run publication audit
        run: npm run audit

  browser:
    name: browser (20)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop browser acceptance
        shell: pwsh
        run: |
          # Temporary bounded diagnostics: preserve the actual acceptance exit code.
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP 'desktop-browser-acceptance.log'
          npm run test:browser *> $log
          $result = $LASTEXITCODE
          Get-Content -LiteralPath $log -Tail 80 | ForEach-Object {
            $line = [string]$_
            if ($line.Length -gt 1200) {
              Write-Output ($line.Substring(0, 1000) + ' ... [diagnostic line truncated] ... ' + $line.Substring($line.Length - 200))
            } else {
              Write-Output $line
            }
          }
          exit $result

      - name: Run mobile browser acceptance
        run: npm run test:browser:mobile
